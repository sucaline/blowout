  </defs>

  <rect width="1024" height="1024" fill="#0a0a0b"/>

  <!-- the blast -->
  <polygon fill="#ff3d1f" points="995,641 824,692 823,823 692,824 641,995 512,872 398,937 332,824 158,866 200,692 87,626 152,512 29,383 200,332 201,201 332,200 383,29 512,152 626,87 692,200 866,158 824,332 937,398 872,512"/>
