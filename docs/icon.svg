  <!-- frame and its screws -->
  <circle cx="512" cy="512" r="334" fill="#f3f0e8"/>
  <g fill="#0a0a0b">
    <circle cx="823" cy="512" r="11"/>
    <circle cx="512" cy="823" r="11"/>
    <circle cx="201" cy="512" r="11"/>
    <circle cx="512" cy="201" r="11"/>
