<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BLOWOUT">
  <title>BLOWOUT</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="logo">BLOW<span>OUT</span></div>
      <button id="power" class="power" aria-pressed="true">BOOST: ON</button>
    </header>

    <section class="meter">
      <canvas id="bars"></canvas>
      <div class="meter-foot">
        <span id="clip-light" class="clip-light">CLIP</span>
        <span id="over" class="over">&nbsp;</span>
      </div>
    </section>

    <section class="player">
      <button id="pick" class="btn btn-hot btn-wide">CHOOSE A SONG</button>
      <input id="file-input" type="file" hidden
             accept="audio/*,.mp3,.wav,.flac,.ogg,.m4a,.opus,.aac">
      <p id="file-name" class="file-name">Nothing loaded yet</p>
      <div class="transport">
        <button id="play" class="play-btn" aria-label="Play or pause" disabled>&#9654;</button>
        <span id="time-now" class="time">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" disabled>
        <span id="time-total" class="time">0:00</span>
        <button id="loop" class="btn btn-small" aria-pressed="false">LOOP</button>
      </div>
      <p id="status" class="status" hidden></p>
      <audio id="local" playsinline preload="auto"></audio>
    </section>

    <section class="group">
      <p class="label">PRESETS</p>
      <div class="presets">
        <button class="btn" data-preset="warm">WARM</button>
        <button class="btn" data-preset="boosted">BOOSTED</button>
        <button class="btn" data-preset="fried">FRIED</button>
        <button class="btn btn-hot" data-preset="earrape">EARRAPE</button>
      </div>
    </section>

    <section class="group">
      <label class="slider">
        <span class="label">BASS <output id="bass-out"></output></span>
        <input id="bass" type="range" min="0" max="40" step="1">
      </label>
      <label class="slider">
        <span class="label">BASS REACH <output id="freq-out"></output></span>
        <input id="freq" type="range" min="40" max="300" step="5">
      </label>
      <label class="slider">
        <span class="label">LOUD <output id="loud-out"></output></span>
        <input id="loud" type="range" min="0" max="40" step="1">
      </label>
    </section>

    <section class="group">
      <p class="label">CLIP STYLE</p>
      <div class="segmented">
        <button data-clip="soft">SOFT</button>
        <button data-clip="hard">HARD</button>
        <button data-clip="square">SQUARE</button>
      </div>
    </section>

    <section class="group">
      <label class="slider">
        <span class="label">OUTPUT VOLUME <output id="out-out"></output></span>
        <input id="out" type="range" min="0" max="100" step="1">
      </label>
      <p class="hint">Comes after the clipper, so turning this down keeps all the crunch and just saves your ears.</p>
    </section>

    <p id="install-tip" class="hint tip" hidden>On iPhone: tap Share, then “Add to Home Screen” to install it like an app.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
