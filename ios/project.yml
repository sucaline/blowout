name: BLOWOUT
options:
  bundleIdPrefix: io.github.sucaline
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  BLOWOUT:
    type: application
    platform: iOS
    sources:
      - path: BLOWOUT
      # The same engine the Chrome extension runs; the app injects it into YouTube pages.
      - path: ../extension/page.js
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: BLOWOUT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sucaline.blowout
        MARKETING_VERSION: "1.3.1"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
